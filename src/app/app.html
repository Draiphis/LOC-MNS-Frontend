<!-- TopAppBar Component -->
<header class="top-app-bar">
  <div class="top-app-bar__inner">
    <div class="top-app-bar__left">
      @if (authService.jwtInfo() != null) {
        <button class="icon-btn" (click)="toggleDrawer()">
          <span class="material-symbols-outlined">menu</span>
        </button>
      }

      <h1 class="top-app-bar__title">MNS Loc</h1>
    </div>
    <div class="top-app-bar__right">
      <button class="icon-btn" [routerLink]="['/profil']" aria-label="Voir mon profil">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </div>
  </div>
</header>

<!-- NavigationDrawer Overlay -->
<div
  class="drawer-overlay"
  [class.drawer-overlay--visible]="drawerOpen"
  (click)="toggleDrawer()"
></div>

<!-- NavigationDrawer Component -->
<aside class="drawer" [class.drawer--visible]="drawerOpen">
  <div class="drawer__inner">
    <h2 class="drawer__title">MNS Loc</h2>
    <nav class="drawer__nav">
      <a class="drawer__link" [routerLink]="['/catalogue']" (click)="toggleDrawer()">
        <span class="material-symbols-outlined">inventory_2</span>
        <span>Catalogue</span>
      </a>
      <a class="drawer__link" [routerLink]="['/profil']" (click)="toggleDrawer()">
        <span class="material-symbols-outlined">history_edu</span>
        <span>Profil</span>
      </a>
      <a class="drawer__link" [routerLink]="['/connexion']" (click)="authService.deconnexion()">
        <span class="material-symbols-outlined">settings</span>
        <span>Deconnexion</span>
      </a>
    </nav>
  </div>
</aside>

<router-outlet />

<!-- TopAppBar Component -->
<header class="top-app-bar">
  <div class="top-app-bar__inner">
    <div class="top-app-bar__left">
      @if (authService.jwtInfo() != null) {
        <button class="icon-btn" (click)="toggleDrawer()">
          <span class="material-symbols-outlined">menu</span>
        </button>
      }

      <h1 class="top-app-bar__title">MNS Loc</h1>
    </div>
    <div class="top-app-bar__right">
      <button
        class="icon-btn"
        [routerLink]="
          authService.isAdmin() ? ['/admin/utilisateurs/nouveau'] : ['/profil']
        "
        aria-label="Voir mon espace"
      >
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </div>
  </div>
</header>

<!-- NavigationDrawer Overlay -->
<div
  class="drawer-overlay"
  [class.drawer-overlay--visible]="drawerOpen"
  (click)="toggleDrawer()"
></div>

<!-- NavigationDrawer Component -->
<aside class="drawer" [class.drawer--visible]="drawerOpen">
  <div class="drawer__inner">
    <h2 class="drawer__title">MNS Loc</h2>
    <nav class="drawer__nav">
      @if (authService.isAdmin()) {
        <a class="drawer__link" [routerLink]="['/admin/emprunts']" (click)="toggleDrawer()">
          <span class="material-symbols-outlined">fact_check</span>
          <span>Validation des emprunts</span>
        </a>
        <a
          class="drawer__link"
          [routerLink]="['/admin/utilisateurs/nouveau']"
          (click)="toggleDrawer()"
        >
          <span class="material-symbols-outlined">person_add</span>
          <span>Ajouter un utilisateur</span>
        </a>
      } @else {
        <a class="drawer__link" [routerLink]="['/catalogue']" (click)="toggleDrawer()">
          <span class="material-symbols-outlined">inventory_2</span>
          <span>Catalogue</span>
        </a>
        <a class="drawer__link" [routerLink]="['/profil']" (click)="toggleDrawer()">
          <span class="material-symbols-outlined">history_edu</span>
          <span>Profil</span>
        </a>
      }
      <a class="drawer__link" [routerLink]="['/connexion']" (click)="authService.deconnexion()">
        <span class="material-symbols-outlined">settings</span>
        <span>Deconnexion</span>
      </a>
    </nav>
  </div>
</aside>

<router-outlet />
